name: Scheduled jobs

# Replaces the paid Render cron job.
# - Keep-alive: pings the API every ~12 minutes during working hours so the free Render
#   instance doesn't sleep (it spins down after 15 idle minutes) and Supabase's free
#   project isn't paused for inactivity.
# - Cleanup: calls the internal cron endpoint once an hour (prunes rate-limit rows,
#   sweeps unclaimed uploads).
# Window: 03:00–15:59 UTC (08:30–21:29 IST), Monday–Saturday. Roughly 1,700 runs/month,
# which stays inside GitHub's 2,000 free Actions minutes for a private repo.
# GitHub may delay scheduled runs at busy times, so the occasional cold start can still happen.

on:
  schedule:
    - cron: '*/12 3-15 * * 1-6'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Keep API and database awake
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            "${{ secrets.API_URL }}/api/ready" -o /dev/null

      - name: Hourly cleanup
        run: |
          minute=$(date -u +%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$minute" -lt 12 ]; then
            curl -fsS --max-time 60 -X POST "${{ secrets.API_URL }}/api/internal/cron" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" -o /dev/null
          else
            echo "Not the first run of the hour; skipping cleanup."
          fi
